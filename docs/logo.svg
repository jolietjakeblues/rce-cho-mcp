<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="160" height="160" role="img" aria-labelledby="rce-cho-mcp-logo-title rce-cho-mcp-logo-desc">
  <title id="rce-cho-mcp-logo-title">RCE CHO MCP</title>
  <desc id="rce-cho-mcp-logo-desc">A gabled heritage-building silhouette drawn as a connected knowledge graph, with two external nodes linking into it.</desc>

  <!-- house structure (roof, walls, base) -->
  <g fill="none" stroke="#4F46E5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M100 36 L46 92 L154 92 Z" />
    <path d="M46 92 L46 164" />
    <path d="M154 92 L154 164" />
    <path d="M46 164 L154 164" />
  </g>

  <!-- door / central graph edge -->
  <path d="M100 36 L100 164" fill="none" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round" />

  <!-- incoming query links -->
  <g fill="none" stroke="#22D3EE" stroke-width="4.5" stroke-linecap="round">
    <path d="M46 92 L18 54" />
    <path d="M154 92 L182 54" />
  </g>

  <!-- external query nodes -->
  <g fill="#22D3EE">
    <circle cx="18" cy="54" r="8" />
    <circle cx="182" cy="54" r="8" />
  </g>

  <!-- heritage-object graph nodes -->
  <g fill="#F59E0B">
    <circle cx="100" cy="36" r="9" />
    <circle cx="46" cy="92" r="8" />
    <circle cx="154" cy="92" r="8" />
    <circle cx="46" cy="164" r="8" />
    <circle cx="154" cy="164" r="8" />
    <circle cx="100" cy="164" r="8" />
  </g>
</svg>
