[project]
name = "rce-cho-mcp"
version = "0.2.0b1"
description = "MCP server for querying the Dutch RCE Cultural Heritage Objects linked data endpoint"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "EUPL-1.2" }

authors = [
{ name = "Joop" }
]

keywords = [
"mcp",
"model-context-protocol",
"linked-data",
"sparql",
"rdf",
"skos",
"rce",
"cultural-heritage"
]

classifiers = [
"Development Status :: 4 - Beta",
"Intended Audience :: Developers",
"License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
"Programming Language :: Python :: 3",
"Programming Language :: Python :: 3.11",
"Programming Language :: Python :: 3.12",
"Programming Language :: Python :: 3.13",
"Programming Language :: Python :: 3.14",
"Topic :: Software Development :: Libraries :: Python Modules"
]

dependencies = [
"mcp>=1.0.0",
"rdflib>=7.0.0"
]

[project.optional-dependencies]
dev = [
"pytest>=9.0",
"pytest-asyncio>=1.0",
"ruff>=0.12"
]

[project.scripts]
rce-cho-mcp = "rce_cho_mcp.server:main"

[project.urls]
Homepage = "https://github.com/jolietjakeblues/rce-cho-mcp"
Repository = "https://github.com/jolietjakeblues/rce-cho-mcp"
Issues = "https://github.com/jolietjakeblues/rce-cho-mcp/issues"
Changelog = "https://github.com/jolietjakeblues/rce-cho-mcp/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
"E",
"F",
"I",
"UP",
"B"
]
