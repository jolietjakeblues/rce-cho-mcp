[project]
name = "rce-cho-mcp"
version = "0.5.0b1"
description = "MCP server for querying the Dutch RCE Cultural Heritage Objects linked data endpoint"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "EUPL-1.2" }

authors = [
  { name = "Joop" }
]

keywords = [
  "mcp",
  "model-context-protocol",
  "linked-data",
  "sparql",
  "rdf",
  "skos",
  "rce",
  "cultural-heritage"
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules"
]

dependencies = [
  # 1.30 is the floor, not 1.27: it's the first release patching
  # CVE-2026-109527 (unbounded request body on HTTP server transport -- DoS)
  # and CVE-2026-59951 (Streamable HTTP sessions never reclaimed), both High
  # and both directly relevant to this project's deployed transport
  # (http_server.py runs Streamable HTTP). Verified 2026-11-06 against the
  # upstream GitHub Security Advisories for modelcontextprotocol/python-sdk,
  # not a secondary source. No lockfile pins this further, so the floor is
  # the only guarantee a future build won't resolve an old, vulnerable mcp.
  "mcp>=1.30,<2",
  "rdflib>=7.0.0,<8",
  "pydantic>=2.0,<3"
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
  "pytest-asyncio>=1.0",
  "ruff>=0.12"
]

[project.scripts]
rce-cho-mcp = "rce_cho_mcp.server:main"

[project.urls]
Homepage = "https://github.com/jolietjakeblues/rce-cho-mcp"
Repository = "https://github.com/jolietjakeblues/rce-cho-mcp"
Issues = "https://github.com/jolietjakeblues/rce-cho-mcp/issues"
Changelog = "https://github.com/jolietjakeblues/rce-cho-mcp/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B"
]
